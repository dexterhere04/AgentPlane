services:
  vault:
    image: hashicorp/vault:1.18
    container_name: agentplane-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8202:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
    networks:
      - agentplane

  vault-init:
    image: hashicorp/vault:1.18
    container_name: agentplane-vault-init
    depends_on:
      vault:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
    command:
      - |
        vault secrets enable -path=agentplane kv-v2

        vault auth enable approle

        vault policy write agentplane-policy - <<EOF
        path "agentplane/data/*" {
          capabilities = ["read"]
        }
        path "agentplane/data/OPENAI_API_KEY" {
          capabilities = ["create", "update", "read"]
        }
        EOF

        vault write auth/approle/role/agentplane-role \
          token_policies="agentplane-policy" \
          token_ttl=1h \
          token_max_ttl=4h

        vault kv put agentplane/OPENAI_API_KEY value=sk-test-from-vault

        # Server-side pepper mixed into API-key hashes. Change this for any
        # non-development deployment; a leaked pepper lets an attacker
        # brute-force the stored SHA-256 secret hashes.
        vault kv put agentplane/API_KEY_PEPPER value=dev-pepper-change-me

        ROLE_ID=$$(vault read -field=role_id auth/approle/role/agentplane-role/role-id)
        SECRET_ID=$$(vault write -f -field=secret_id auth/approle/role/agentplane-role/secret-id)

        echo "VAULT_ROLE_ID=$$ROLE_ID"  > /vault-creds/creds.env
        echo "VAULT_SECRET_ID=$$SECRET_ID" >> /vault-creds/creds.env

        echo "--- AppRole Credentials written to /vault-creds/creds.env ---"
        # Intentionally not printing credentials to logs
    volumes:
      - vault-creds:/vault-creds
    networks:
      - agentplane

  postgres:
    image: postgres:16-alpine
    container_name: agentplane-postgres
    environment:
      POSTGRES_USER: agentplane
      POSTGRES_PASSWORD: agentplane
      POSTGRES_DB: agentplane
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentplane -d agentplane"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
    networks:
      - agentplane

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: agentplane-clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: agentplane
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
    networks:
      - agentplane

  mock:
    build:
      context: ./testing
      dockerfile: Dockerfile
    container_name: agentplane-mock
    environment:
      MOCK_PORT: "3002"
    ports:
      - "3002:3002"
    networks:
      - agentplane

  gateway:
    build: .
    container_name: agentplane-gateway
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      SECRET_STORE: vault
      VAULT_ADDR: http://vault:8200
      VAULT_MOUNT_PATH: agentplane
      OPENAI_BASE_URL: http://mock:3002/v1
      DATABASE_URL: postgres://agentplane:agentplane@postgres:5432/agentplane?sslmode=disable
      AGENTPLANE_ADMIN_TOKEN: dev-admin-token-change-me
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: agentplane
      GUARDRAIL_SECRETS: enforce
      GUARDRAIL_PII: enforce
      GUARDRAIL_PROMPT_INJECTION: enforce
      GUARDRAIL_CONTENT_MODERATION: enforce
    volumes:
      - vault-creds:/vault-creds
    depends_on:
      vault-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      mock:
        condition: service_started
    networks:
      - agentplane

networks:
  agentplane:

volumes:
  vault-creds:
  pgdata:
