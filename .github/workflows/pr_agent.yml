name: PR Agent (DeepSeek)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    name: Run pr agent on every pull request, respond to user comments
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: "deepseek/deepseek-v4-pro"
          config.fallback_models: '["deepseek/deepseek-v4-flash"]'
          DEEPSEEK.KEY: ${{ secrets.DEEPSEEK_KEY }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "synchronize", "ready_for_review"]'
          pr_reviewer.extra_instructions: "Focus on security vulnerabilities, guardrail correctness, secret handling, error handling, and Go best practices."
          pr_reviewer.require_tests_review: "true"
          pr_code_suggestions.num_code_suggestions: 6
