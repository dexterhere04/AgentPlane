server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Upstreams are resolved per request instead of once at
    # startup, so nginx boots even if the gateway container isn't ready yet
    # (the previous frontend crash-looped on "host not found in upstream").
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $gateway http://gateway:3001;
    set $grafana http://grafana:3000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Static app (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Chat completions — streamed, so buffering must be off.
    location /chat {
        proxy_pass $gateway;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    # Live telemetry stream (SSE).
    location /events {
        proxy_pass $gateway;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 24h;
    }

    location /provision          { proxy_pass $gateway; }
    location /admin              { proxy_pass $gateway; }
    location /metrics            { proxy_pass $gateway; }
    location /api/observability/ { proxy_pass $gateway; }
    location /analytics          { proxy_pass $gateway; }

    # Grafana deep-dive dashboards, served from a sub-path. Grafana keeps its
    # own login; this proxy exists so it is reachable same-origin without
    # publishing a separate host port.
    location = /grafana { return 301 /grafana/; }
    location /grafana/ {
        proxy_pass $grafana;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
