<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentPlane — Gateway Control Plane</title>
    <meta name="description" content="AgentPlane gateway control plane: routing, guardrails, observability and identity." />
    <link rel="icon" type="image/svg+xml" href="./assets/logo.svg" />
    <link rel="stylesheet" href="./assets/oat.min.css" />
    <link rel="stylesheet" href="./src/theme.css" />
    <link rel="stylesheet" href="./src/app.css" />
    <script src="./assets/oat.min.js" defer></script>
  </head>
  <body data-sidebar-layout="always">
    <!-- ── Top bar ─────────────────────────────────────────────── -->
    <header data-topnav>
      <button data-sidebar-toggle class="outline" aria-label="Toggle navigation" title="Toggle navigation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" /></svg>
      </button>

      <a href="#overview" class="brand unstyled" aria-label="AgentPlane home">
        <img class="brand-logo" src="./assets/logo.svg" width="30" height="30" alt="" />
        <span class="brand-text">
          <strong class="brand-name">AgentPlane</strong>
          <span class="brand-sub">Gateway Control Plane</span>
        </span>
      </a>

      <span class="brand-divider" aria-hidden="true"></span>

      <nav aria-label="Breadcrumb" class="topbar-crumb">
        <ol class="unstyled hstack">
          <li class="text-lighter">Control Plane</li>
          <li aria-hidden="true" class="text-lighter">/</li>
          <li><strong id="crumb-current">Overview</strong></li>
        </ol>
      </nav>

      <span class="topbar-spacer"></span>

      <span id="stream-status" class="badge" data-variant="secondary" title="Gateway event stream">
        <span class="status-dot"></span> Connecting…
      </span>

      <button id="theme-toggle" class="outline" title="Toggle light / dark theme" aria-label="Toggle theme">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>

      <button id="settings-open" class="outline" title="Connection &amp; credentials" aria-label="Connection and credentials">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </header>

    <!-- ── Sidebar ─────────────────────────────────────────────── -->
    <aside data-sidebar>
      <nav aria-label="Primary">
        <ul class="side-nav" id="side-nav">
          <!-- filled by main.js -->
        </ul>
      </nav>

      <footer class="side-foot">
        <span id="side-stream" class="hstack text-light">
          <span class="status-dot off"></span> Gateway offline
        </span>
        <small class="text-lighter">v0.1.0</small>
      </footer>
    </aside>

    <!-- ── Main content ────────────────────────────────────────── -->
    <main>
      <div id="view" class="view"></div>
    </main>

    <!-- ── Settings dialog ─────────────────────────────────────── -->
    <dialog id="settings-dialog">
      <form method="dialog">
        <header>
          <h3>Connection &amp; credentials</h3>
          <p class="text-light">Stored locally in this browser. Nothing leaves the gateway.</p>
        </header>

        <div class="vstack">
          <label data-field>
            Admin token
            <input id="admin-token" type="password" autocomplete="off" spellcheck="false" class="mono" placeholder="AGENTPLANE_ADMIN_TOKEN" />
            <small data-hint>Guards provisioning, provider secrets, routing &amp; analytics.</small>
          </label>

          <label data-field>
            User API key
            <input id="user-key" type="password" autocomplete="off" spellcheck="false" class="mono" placeholder="ap_live_…" />
            <small data-hint>Used to send chat requests through the gateway.</small>
          </label>

          <div id="settings-status" class="vstack" role="status" aria-live="polite"></div>
        </div>

        <footer>
          <button type="button" id="settings-reset" class="outline">Reset setup guide</button>
          <span class="topbar-spacer"></span>
          <button type="button" id="settings-validate" class="outline">Validate</button>
          <button value="save" id="settings-save">Save</button>
        </footer>
      </form>
    </dialog>

    <!-- ── Chat overlay ────────────────────────────────────────── -->
    <div id="chat-overlay" hidden></div>

    <script type="module" src="./src/js/main.js"></script>
  </body>
</html>
